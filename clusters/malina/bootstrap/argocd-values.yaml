# ArgoCD Helm values for cluster "malina" (chart argo/argo-cd 10.10.5).
# No secrets here — see Constitution III.

global:
  domain: argocd.kreciowo.pl

configs:
  params:
    # TLS is terminated at Traefik; argocd-server speaks plain HTTP inside.
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.kreciowo.pl
    # Uses TLS secret `argocd-server-tls` (issued by cert-manager, see
    # clusters/malina/infrastructure/certificates.yaml).
    tls: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

controller:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

repoServer:
  # 256Mi and even 512Mi were OOMKilled on the Pi when several apps
  # reconciled at once (e.g. right after a node reboot). 1Gi is safe on
  # the 8 GB node.
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 1Gi }

redis:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

dex:
  enabled: false   # no SSO in a homelab — local admin account only
