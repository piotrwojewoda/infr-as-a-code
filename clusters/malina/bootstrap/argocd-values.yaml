# ArgoCD Helm values for cluster "malina" (chart argo/argo-cd 10.10.5).
# No secrets here — see Constitution III.

global:
  domain: argocd.kreciowo.pl

configs:
  params:
    # TLS is terminated at Traefik; argocd-server speaks plain HTTP inside.
    server.insecure: true
    # ArgoCD lives UNDER the main domain (real cert has no wildcard SANs).
    # basehref = links/assets; rootpath = actually moves the routes (v3.x).
    server.basehref: /argocd
    server.rootpath: /argocd

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: kreciowo.pl
    path: /argocd
    annotations:
      # spec 003: the UI is LAN-only.
      traefik.ingress.kubernetes.io/router.middlewares: kube-system-lan-only@kubernetescrd
    # Uses TLS secret `argocd-server-tls` — the operator loads the REAL
    # certificate into it (the name is fixed by the chart).
    tls: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

controller:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

repoServer:
  # 256Mi and even 512Mi were OOMKilled on the Pi when several apps
  # reconciled at once (e.g. right after a node reboot). 1Gi is safe on
  # the 8 GB node.
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 1Gi }

redis:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

dex:
  enabled: false   # no SSO in a homelab — local admin account only
