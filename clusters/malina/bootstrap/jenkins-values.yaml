# Jenkins Helm values for cluster "malina" (chart jenkinsci/jenkins 5.9.69).
# Everything is Configuration as Code (JCasC + Job DSL). No secrets here —
# the GitHub PAT comes from the Kubernetes Secret `jenkins-github`
# (created by 10-install-platform.sh) via env vars.

controller:
  image:
    repository: jenkins/jenkins
    tag: lts-jdk21   # multi-arch (arm64 verified)

  # Jenkins lives UNDER the main domain (the real certificate covers only
  # kreciowo.pl + www.kreciowo.pl — no wildcard).
  jenkinsUriPrefix: /jenkins

  installPlugins:
    - kubernetes            # pod-based build agents
    - workflow-aggregator   # pipelines
    - git
    - github                # GitHub webhook trigger (no polling)
    - configuration-as-code
    - job-dsl               # seed jobs from code
    - credentials-binding
    - plain-credentials     # Secret text credential (webhook shared secret)

  # Builds run on Kubernetes agents only, never on the controller.
  numExecutors: 0

  javaOpts: "-Xms512m -Xmx1024m"
  resources:
    requests: { cpu: 250m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 2Gi }

  serviceType: ClusterIP
  persistence:
    enabled: true
    storageClass: local-path
    size: 8Gi

  ingress:
    enabled: true
    apiVersion: networking.k8s.io/v1
    ingressClassName: traefik
    hostName: kreciowo.pl
    path: /jenkins
    tls:
      - secretName: kreciowo-tls   # REAL cert (loaded by operator, not in git)
        hosts:
          - kreciowo.pl

  # Injected from Kubernetes Secret `jenkins-github` (not from git).
  containerEnv:
    - name: GITHUB_USER
      valueFrom:
        secretKeyRef: { name: jenkins-github, key: username }
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef: { name: jenkins-github, key: token }
    - name: GITHUB_WEBHOOK_SECRET
      valueFrom:
        secretKeyRef: { name: jenkins-github, key: webhook-secret }

  systemMessage: "Jenkins on k3s @ Raspberry Pi (malina) - configured as code"

  JCasC:
    enabled: true
    defaultConfig: true
    configScripts:
      platform-config: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-pat"
                      username: "${GITHUB_USER}"
                      password: "${GITHUB_TOKEN}"
                      description: "GitHub PAT: ghcr.io push + GitOps repo push"
                  - string:
                      scope: GLOBAL
                      id: "github-webhook-secret"
                      secret: "${GITHUB_WEBHOOK_SECRET}"
                      description: "GitHub webhook shared secret (X-Hub-Signature-256)"
        jobs:
          - script: |
              pipelineJob('demo-symfony-k3s') {
                description('Merge to main -> Kaniko build -> push to ghcr.io -> bump GitOps repo tag. Trigger: GitHub webhook -> https://kreciowo.pl/jenkins/github-webhook/ (no polling).')
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/piotrwojewoda/demo-symfony-k3s.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                    lightweight(true)
                  }
                }
                triggers { githubPush() }
              }
        unclassified:
          githubpluginconfig:
            hookSecretConfigs:
              - credentialsId: "github-webhook-secret"
                signatureAlgorithm: "SHA256"

agent:
  enabled: true
  namespace: jenkins
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }
