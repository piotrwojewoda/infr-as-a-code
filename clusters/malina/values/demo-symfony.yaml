# Environment values for the demo-symfony chart on cluster "malina".
#
# `image.tag` is the ONLY field modified by the Jenkins pipeline
# (contract: specs/001-k3s-cicd-platform/contracts/pipeline.md).
# Format: short git SHA of the app repository, or "latest" before first build.
image:
  # GitHub Container Registry (spec 004) — images are built and stored in
  # GHCR, not on the Pi's SD card. See research.md D1.
  repository: ghcr.io/piotrwojewoda/demo-symfony-k3s
  tag: "c764feb"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull   # private GHCR package; created by 10-install-platform.sh

ingress:
  # kreciowo.pl + www and bibop.pl + www use REAL certificates (home.pl DV,
  # secrets loaded by the operator via bootstrap/real-cert.sh — never in
  # git). demo.* keeps the dummy cert for now.
  hosts:
    - host: kreciowo.pl
    - host: www.kreciowo.pl
    - host: demo.kreciowo.pl
    - host: bibop.pl
    - host: www.bibop.pl
  tls:
    kreciowo-tls:
      - kreciowo.pl
      - www.kreciowo.pl
    kreciowo-dummy-tls:
      - demo.kreciowo.pl
    bibop-tls:
      - bibop.pl
      - www.bibop.pl

resources:
  requests: { cpu: 50m,  memory: 128Mi }
  limits:   { cpu: 300m, memory: 256Mi }
