# In-cluster container registry (fallback — see specs/001-k3s-cicd-platform/research.md D2).
#
# Chosen because the operator's GitHub token has no Packages:write scope for
# ghcr.io. Exposed as NodePort 30500 on the node so that BOTH:
#   - Kaniko build pods can PUSH images over plain HTTP (kaniko --insecure)
#   - containerd on the node can PULL them (mirrors entry in
#     /etc/rancher/k3s/registries.yaml — written by 10-install-platform.sh)
# No authentication: LAN-only homelab exposure. Replace with GHCR once the
# token has packages:write (see runbook).
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels: { app: registry }
spec:
  replicas: 1
  strategy:
    type: Recreate          # single-writer on a PVC
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
