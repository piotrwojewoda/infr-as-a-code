# Dummy (self-signed) TLS certificate — demo.kreciowo.pl ONLY.
#
# The bought certificate (home.pl DV) has no wildcard SAN, it covers only
# kreciowo.pl + www.kreciowo.pl. Those hosts use the REAL certificate,
# installed by `bootstrap/real-cert.sh` into `kreciowo-tls` (demo, jenkins)
# and `argocd-server-tls` (argocd). The cert and key never enter git
# (Constitution III).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kreciowo-dummy
  namespace: demo
spec:
  secretName: kreciowo-dummy-tls
  dnsNames:
    - demo.kreciowo.pl
  issuerRef:
    name: selfsigned-dummy
    kind: ClusterIssuer
