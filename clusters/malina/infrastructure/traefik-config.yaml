# Global Traefik tweak for k3s: redirect all HTTP (port 80) to HTTPS (443).
# k3s watches HelmChartConfig objects and re-renders the bundled Traefik
# Helm release with this extra values content.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
