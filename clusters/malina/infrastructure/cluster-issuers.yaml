# ClusterIssuers for cluster "malina".
#
# * `selfsigned-dummy`  — ACTIVE. Issues the dummy certificates used until the
#   real certificate is available.
# * `letsencrypt-prod`  — PREPARED for the swap. Activate it once DNS for
#   *.kreciowo.pl points to the Pi and the router forwards ports 80/443
#   (see specs/001-k3s-cicd-platform/quickstart.md, "Swap the dummy
#   certificate"). Remember to set a real e-mail first.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-dummy
  labels:
    app.kubernetes.io/part-of: platform
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@kreciowo.pl # TODO(operator): confirm e-mail before real use
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
