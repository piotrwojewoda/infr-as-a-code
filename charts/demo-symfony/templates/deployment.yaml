apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-symfony.fullname" . }}
  labels:
    {{- include "demo-symfony.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "demo-symfony.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-symfony.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: APP_ENV
              value: "prod"
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.envSecretName }}
                  key: DATABASE_URL
            {{- if .Values.elasticsearch.enabled }}
            # Elasticsearch (spec 008): password + CA are FILES mounted from
            # ECK Secrets, read at request time (Secret rotation needs no
            # restart; both mounts are optional so the pod starts even before
            # the ES cluster is Ready).
            - name: ELASTICSEARCH_URL
              value: {{ .Values.elasticsearch.url | quote }}
            - name: ELASTICSEARCH_USER
              value: {{ .Values.elasticsearch.user | quote }}
            - name: ELASTICSEARCH_PASSWORD_FILE
              value: "/etc/es-credentials/{{ .Values.elasticsearch.credentialsKey }}"
            - name: ELASTICSEARCH_CA
              value: "/etc/es-ca/{{ .Values.elasticsearch.caKey }}"
            {{- end }}
          {{- if .Values.elasticsearch.enabled }}
          volumeMounts:
            - name: es-credentials
              mountPath: /etc/es-credentials
              readOnly: true
            - name: es-ca
              mountPath: /etc/es-ca
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.elasticsearch.enabled }}
      volumes:
        # ECK-generated Secrets (spec 007) — optional: they exist only once
        # Elasticsearch has been reconciled; the app waits gracefully.
        - name: es-credentials
          secret:
            secretName: {{ .Values.elasticsearch.credentialsSecret }}
            optional: true
            items:
              - key: {{ .Values.elasticsearch.credentialsKey }}
                path: {{ .Values.elasticsearch.credentialsKey }}
        - name: es-ca
          secret:
            secretName: {{ .Values.elasticsearch.caSecret }}
            optional: true
            items:
              - key: {{ .Values.elasticsearch.caKey }}
                path: {{ .Values.elasticsearch.caKey }}
      {{- end }}
