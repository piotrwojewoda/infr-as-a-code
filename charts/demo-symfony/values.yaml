# Default values for demo-symfony.
# Cluster-specific overrides live in clusters/<name>/values/demo-symfony.yaml
# (ArgoCD multi-source application).

replicaCount: 1

image:
  repository: ghcr.io/piotrwojewoda/demo-symfony-k3s
  tag: "latest"          # overridden per environment; bumped by Jenkins
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: demo.kreciowo.pl
  # tls: map of secretName -> list of hosts it covers
  tls:
    kreciowo-dummy-tls:
      - demo.kreciowo.pl

# References to the bootstrap-created Secret holding APP_SECRET + DATABASE_URL.
envSecretName: demo-app

resources:
  requests: { cpu: 50m,  memory: 128Mi }
  limits:   { cpu: 300m, memory: 256Mi }

probes:
  path: /healthz
