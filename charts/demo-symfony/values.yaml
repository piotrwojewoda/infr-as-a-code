# Default values for demo-symfony.
# Cluster-specific overrides live in clusters/<name>/values/demo-symfony.yaml
# (ArgoCD multi-source application).

replicaCount: 1

image:
  repository: ghcr.io/piotrwojewoda/demo-symfony-k3s
  tag: "latest"          # overridden per environment; bumped by Jenkins
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: demo.kreciowo.pl
  # tls: map of secretName -> list of hosts it covers
  tls:
    kreciowo-dummy-tls:
      - demo.kreciowo.pl

# References to the bootstrap-created Secret holding APP_SECRET + DATABASE_URL.
envSecretName: demo-app

# Elasticsearch wiring (spec 008). The ECK cluster `demo` (spec 007) runs in
# the same namespace; its password and CA come from ECK-generated Secrets
# mounted as files (never in git). Set `enabled: false` to disable search.
elasticsearch:
  enabled: true
  url: https://demo-es-http:9200
  user: elastic
  credentialsSecret: demo-es-elastic-user
  credentialsKey: elastic
  caSecret: demo-es-http-certs-public
  caKey: ca.crt

resources:
  requests: { cpu: 50m,  memory: 128Mi }
  limits:   { cpu: 300m, memory: 256Mi }

probes:
  path: /healthz
