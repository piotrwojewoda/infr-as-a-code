apiVersion: v2
name: monitoring
description: >-
  Pod load monitoring for the malina cluster (spec 006): Prometheus
  (kubelet/cAdvisor scrape only, 24h retention) + Grafana with the
  provisioned "Pod resources" dashboard. KISS — no alertmanager,
  no node-exporter, no kube-state-metrics.
type: application
version: 0.1.0
dependencies:
  - name: prometheus
    version: "29.38.0"          # Prometheus v3.15.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: grafana
    version: "10.5.15"          # Grafana 12.3.1
    repository: https://grafana.github.io/helm-charts
